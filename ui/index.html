<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Helper</title>

<style>
:root{--bg:#0b0f14;--panel:#12171e;--panel2:#1a212b;--line:#262e3a;--text:#e8eef5;--mute:#8693a3;--accent:#4c8dff;--accent2:#8b5cf6;--green:#3fb950;--red:#ff6b64;--yellow:#e3b341;--addbg:rgba(46,160,67,.16);--delbg:rgba(248,81,73,.15);--shadow:0 12px 40px rgba(0,0,0,.45);--r:10px}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f6fa;--panel:#fff;--panel2:#eef1f6;--line:#dde3ec;--text:#1b2330;--mute:#5f6c7d;--accent:#2563eb;--accent2:#7c3aed;--green:#1a7f37;--red:#d1242f;--yellow:#9a6700;--addbg:#e3f8e9;--delbg:#ffe8e6;--shadow:0 12px 40px rgba(20,30,50,.18)}}
:root[data-theme=light]{--bg:#f4f6fa;--panel:#fff;--panel2:#eef1f6;--line:#dde3ec;--text:#1b2330;--mute:#5f6c7d;--accent:#2563eb;--accent2:#7c3aed;--green:#1a7f37;--red:#d1242f;--yellow:#9a6700;--addbg:#e3f8e9;--delbg:#ffe8e6;--shadow:0 12px 40px rgba(20,30,50,.18)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 500px at 85% -10%,rgba(76,141,255,.10),transparent 60%),var(--bg);color:var(--text);font:var(--fs,14px)/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:rgba(76,141,255,.35)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--mute);background-clip:content-box;border:2px solid transparent}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s,box-shadow .15s}
button:hover{border-color:var(--mute)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(76,141,255,.35)}
button.primary:hover{filter:brightness(1.08);border-color:transparent}
button.danger{color:var(--red)}
button:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;transition:border-color .15s,box-shadow .15s}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,141,255,.25)}
.top{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);height:56px;flex:none;box-shadow:0 2px 12px rgba(0,0,0,.18);position:relative;z-index:10}
.tb{display:flex;flex-direction:column;justify-content:center;padding:0 18px;border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;text-align:left;min-width:150px;box-shadow:none}
.tb small{color:var(--mute);font-size:11px;letter-spacing:.02em}
.tb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.tb:hover{background:var(--panel2)}
#bSync b{color:var(--accent)}
.spacer{flex:1}
.main{flex:1;display:flex;min-height:0}
.side{width:350px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:11px;text-align:center;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;transition:color .15s,background .15s}
.tab:hover{background:var(--panel2)}
.tab.on{color:var(--text);border-image:linear-gradient(90deg,var(--accent),var(--accent2)) 1;font-weight:600}
.list{flex:1;overflow:auto;min-height:0}
.row{display:flex;align-items:center;gap:8px;padding:var(--rp,7px) 12px;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
.row:hover{background:var(--panel2)}
.row.sel{background:rgba(76,141,255,.14);border-left-color:var(--accent)}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .x{visibility:hidden;border:0;background:none;color:var(--mute);padding:0 6px;box-shadow:none}
.row:hover .x{visibility:visible}
.badge{font-size:11px;font-weight:700;width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;background:var(--panel2)}
.A{color:var(--green)}.M{color:var(--yellow)}.D{color:var(--red)}.R{color:var(--accent)}.U{color:var(--red)}
.listhead{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;color:var(--mute);font-size:12px}
.commitbox{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;flex:none;background:var(--panel)}
.commitbox textarea{resize:vertical;min-height:58px}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
#meta{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:none}
#meta .msg{white-space:pre-wrap;margin:4px 0 8px}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;cursor:pointer;transition:background .15s}
.chip:hover{background:var(--panel2)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
#diff{flex:1;overflow:auto;font:var(--dfs,12.5px)/1.5 "Cascadia Mono",Consolas,monospace;min-height:0}
.empty{color:var(--mute);text-align:center;margin-top:18vh;padding:0 20px}
table.d{border-collapse:collapse;width:100%}
table.d td{padding:0 10px;white-space:pre;vertical-align:top}
td.ln{color:var(--mute);text-align:right;width:1%;user-select:none;min-width:44px;opacity:.7}
tr.add{background:var(--addbg)}tr.del{background:var(--delbg)}
tr.hunk td{color:var(--accent);background:rgba(76,141,255,.09)}
tr.meta td{color:var(--mute)}
.pop{position:absolute;top:58px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;width:350px;max-height:70vh;display:none;flex-direction:column;overflow:hidden}
.pop.show{display:flex;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop .list{max-height:48vh}
.pop .pad{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:6px}
.sect{padding:8px 12px 4px;font-size:11px;text-transform:uppercase;color:var(--mute);letter-spacing:.07em}
.banner{background:linear-gradient(90deg,rgba(227,179,65,.16),rgba(139,92,246,.12));border-bottom:1px solid var(--yellow);padding:9px 18px;display:flex;gap:12px;align-items:center;flex:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:70vw;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:11px 18px;box-shadow:var(--shadow);display:none;z-index:50;white-space:pre-wrap;max-height:40vh;overflow:auto}
#toast.err{border-left-color:var(--red)}
.ov{position:fixed;inset:0;background:rgba(5,8,12,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:40;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:480px;max-width:92vw;box-shadow:var(--shadow);animation:pop .18s ease-out}
.dlg h3{margin:0 0 14px;font-size:17px}
.dlg label{display:block;margin:10px 0 4px;color:var(--mute);font-size:12px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.dlg .fr{display:flex;gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent}
.seg button.on{background:var(--accent);color:#fff}
.sw{display:flex;gap:10px;align-items:center}
.sw button{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid transparent}
.sw button.on,.sw input.on{outline:2px solid var(--text);outline-offset:2px}
.sw input[type=color]{width:30px;height:30px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.dlg input[type=range]{width:100%;accent-color:var(--accent)}
.welcome{margin:auto;text-align:center;max-width:500px;padding:20px}
.welcome h1{font-weight:700;font-size:34px;margin:10px 0 6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome .logo{width:76px;height:76px;margin:0 auto;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 14px 40px rgba(76,141,255,.4)}
.welcome .btns{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.welcome button{padding:12px;border-radius:10px}
.welcome .wfeat{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px;text-align:left;display:inline-flex}
.welcome .wlist-h{margin:22px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left}
.welcome .wlist{max-height:210px;overflow:auto;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.welcome .wlist .row{cursor:pointer}
.welcome .wlist .row button{padding:2px 6px}
.pill{background:var(--accent);color:#fff;border-radius:10px;padding:0 8px;font-size:11px;font-weight:600}
.up{color:var(--accent);font-size:11px}
.code{font:700 30px "Cascadia Mono",Consolas,monospace;letter-spacing:.18em;text-align:center;padding:16px;background:var(--bg);border:1px dashed var(--accent);border-radius:12px;user-select:all;margin:12px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#splash{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .35s}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{width:84px;height:84px;margin-bottom:8px;filter:drop-shadow(0 8px 24px rgba(76,141,255,.35))}
#splash h1{margin:0;font-size:28px;letter-spacing:.01em}
#splash .ver{color:var(--mute);font:600 14px "Cascadia Mono",Consolas,monospace}
#splash .msg{color:var(--mute);margin-top:14px;font-size:14px;min-height:20px}
</style>
</head>

const ACCENTS = { blue: ['#4c8dff', '#8b5cf6'], green: ['#2ea043', '#14b8a6'], orange: ['#f08c1f', '#ef4444'], pink: ['#ec4899', '#a855f7'], teal: ['#14b8a6', '#3b82f6'], red: ['#ef4444', '#f97316'] };

async function api(name, data = {}) {
  const r = await fetch('/api/' + name, { method: 'POST', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const j = await r.json().catch(() => ({ error: 'Bad response' }));
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
const R = (name, data = {}) => api(name, { repo: S.repo, ...data });

let toastT;
function toast(msg, err) {
  const el = $('#toast'); el.textContent = msg; el.className = err ? 'err' : ''; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', err ? 9000 : 3500);
}
async function run(label, fn, ok) {
  if (S.busy) return;
  S.busy = label; renderTop();
  try { const r = await fn(); if (ok) toast(typeof ok === 'function' ? ok(r) : ok); return r; }
  catch (e) { toast(e.message, true); }
  finally { S.busy = ''; await refresh(true); }
}

/* ---------- modal ---------- */
function modal(title, fields, okLabel = 'OK') {
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = `<div class="dlg"><h3>${esc(title)}</h3>` + fields.map(f => f.type === 'checkbox'
      ? `<label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="f_${f.id}" ${f.value ? 'checked' : ''}> ${esc(f.label)}</label>`
      : f.type === 'note' ? `<p style="color:var(--mute)">${esc(f.label)}</p>`
      : `<label>${esc(f.label)}</label><div class="fr"><input type="text" id="f_${f.id}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}">${f.browse ? `<button data-b="${f.id}">${esc(t('Огляд…'))}</button>` : ''}</div>`).join('')
      + `<div class="acts"><button id="mc">${esc(t('Скасувати'))}</button><button class="primary" id="mo">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(ov);
    const done = v => { ov.remove(); res(v); };
    ov.querySelectorAll('[data-b]').forEach(b => b.onclick = async () => {
      const inp = ov.querySelector('#f_' + b.dataset.b);
      try { const r = await api('pickfolder', { start: inp.value }); if (r.path) inp.value = r.path; } catch (e) { toast(e.message, true); }
    });
    const submit = () => { const v = {}; fields.forEach(f => { if (f.type === 'note') return; const el = ov.querySelector('#f_' + f.id); v[f.id] = f.type === 'checkbox' ? el.checked : el.value.trim(); }); done(v); };
    ov.querySelector('#mo').onclick = submit; ov.querySelector('#mc').onclick = () => done(null);
    ov.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') submit(); if (e.key === 'Escape') done(null); });
    const first = ov.querySelector('input'); first && first.focus();
  });
}

/* ---------- refresh ---------- */
let refreshing = false;
async function refresh(force) {
  if (!S.repo) return;
  if (refreshing && !force) return;
  refreshing = true;
  try {
    const st = await R('status');
    const j = JSON.stringify(st);
    const changed = j !== S.stJson; S.stJson = j;
    const headMoved = S.st && S.st.head !== st.head; S.st = st;
    if (headMoved && S.tab === 'history' && !force) loadLog();
    if (S.sel && !st.files.find(f => f.path === S.sel)) S.sel = null;
    if (changed || force) {
      renderTop(); renderSide();
      if (S.tab === 'changes') { if (!S.sel && st.files.length) S.sel = st.files[0].path; showFileDiff(); }
    }
    if (force && S.tab === 'history') loadLog();
  } catch (e) { if (force) toast(e.message, true); }
  finally { refreshing = false; }
}
// Poll the working tree often (every 2 s while the window is visible); status carries file mtimes and HEAD,
// so edits to an already-modified file and commits made outside the app are noticed too.
setInterval(() => { if (!document.hidden && !S.busy && S.repo) refresh(false); }, 2000);
window.addEventListener('focus', () => refresh(false));
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
// Heartbeat: the server shuts itself down when the window is closed and pings stop.
setInterval(() => { api('state').catch(() => { }); }, 3000);
// Tell the server right away when the window closes (it waits ~2 s in case this is just a reload).
window.addEventListener('pagehide', () => { try { fetch('/api/bye', { method: 'POST', keepalive: true, headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: '{}' }); } catch (e) { } });
// Periodic refresh of the working tree, plus a background fetch every 2 minutes (updates ahead/behind).
setInterval(async () => { if (S.repo && S.st && S.st.remote && !S.busy) { try { await R('fetch'); await refresh(false); } catch (e) { } } }, 120000);

function syncInfo() {
  const s = S.st; if (!s) return { label: 'Fetch', act: 'fetch', sub: '' };
  if (!s.remote) return { label: t('Опублікувати репозиторій'), act: 'publish', sub: t('додати на GitHub') };
  if (!s.upstream) return { label: t('Опублікувати гілку'), act: 'push', sub: 'push -u' };
  if (s.behind > 0) return { label: `Pull (${s.behind}↓)`, act: 'pull', sub: s.upstream };
  if (s.ahead > 0) return { label: `Push (${s.ahead}↑)`, act: 'push', sub: s.upstream };
  return { label: 'Fetch', act: 'fetch', sub: s.upstream };
}

  const draw = () => {

    const loc = S.branches.local.filter(b => b.name.toLowerCase().includes(f)), rem = S.branches.remote.filter(b => b.name.toLowerCase().includes(f));
    $('#bl').innerHTML = `<div class="sect">${esc(t('Локальні'))}</div>` + loc.map(b => `<div class="row ${b.current ? 'sel' : ''}" data-sw="${esc(b.name)}"><span class="nm">${b.current ? '✓ ' : ''}${esc(b.name)}</span>${b.current ? '' : `<button class="x" data-mg="${esc(b.name)}" title="${esc(t('Влити в поточну'))}">merge</button><button class="x" data-del="${esc(b.name)}" title="${esc(t('Видалити'))}">✕</button>`}</div>`).join('')
      + (rem.length ? `<div class="sect">${esc(t('На сервері'))}</div>` + rem.map(b => `<div class="row" data-sw="${esc(b.name.replace(/^[^/]+\//, ''))}"><span class="nm">${esc(b.name)}</span></div>`).join('') : '');
    $('#bl').querySelectorAll('[data-sw]').forEach(el => el.onclick = e => { if (e.target.dataset.mg || e.target.dataset.del) return; closePops(); if (el.dataset.sw !== cur) run('switch', () => R('switch', { name: el.dataset.sw }), t('Перемкнено на {name}', { name: el.dataset.sw })); });
    $('#bl').querySelectorAll('[data-mg]').forEach(el => el.onclick = e => { e.stopPropagation(); closePops(); if (confirm(t('Влити "{name}" у "{cur}"?', { name: el.dataset.mg, cur }))) run('merge', () => R('merge', { name: el.dataset.mg }), t('Злито')); });
    $('#bl').querySelectorAll('[data-del]').forEach(el => el.onclick = e => { e.stopPropagation(); closePops(); if (confirm(t('Видалити гілку "{name}"?', { name: el.dataset.del }))) run('delete', async () => { try { return await R('deleteBranch', { name: el.dataset.del }); } catch (er) { if (confirm(er.message + '\n\n' + t('Видалити примусово?'))) return R('deleteBranch', { name: el.dataset.del, force: true }); throw er; } }, t('Гілку видалено')); });
  };
  $('#bf').oninput = draw; draw(); $('#bf').focus();
}
async function newBranch() {
  closePops();
  const v = await modal(t('Нова гілка'), [{ id: 'name', label: t('Назва (від поточної: {cur})', { cur: S.st ? S.st.branch : '' }), placeholder: 'feature/my-change' }], t('Створити')); if (!v || !v.name) return;
  run('branch', () => R('createBranch', { name: v.name.replace(/\s+/g, '-') }), t('Гілку створено'));
}

function renderMenuPop(p) {
  const s = S.st || {}, a = S.app, items = [
    [t('Відкрити на GitHub'), () => s.webUrl ? api('open', { what: 'url', url: s.webUrl }) : toast(t('Немає remote'), true), !!s.webUrl],

    [a && a.os === 'linux' ? t('Відкрити у файловому менеджері') : t('Відкрити у Провіднику'), () => R('open', { what: 'explorer' }), true],
    [t('Відкрити в VS Code'), () => R('open', { what: 'code' }), true],
    [t('Відкрити термінал'), () => R('open', { what: 'terminal' }), true],
    ['—'],
    [t('Stash (відкласти зміни)'), () => run('stash', () => R('stash'), r => r.out.trim() || t('Готово')), true],
    [t('Stash pop (повернути)'), () => run('stash', () => R('stashPop'), t('Повернуто')), true],
    [t('Скасувати останній коміт (залишити зміни)'), () => { if (confirm(t('Скасувати останній коміт? Зміни залишаться у файлах.'))) run('undo', () => R('undoCommit'), t('Коміт скасовано')); }, !!s.hasCommits],
    [t('Скасувати злиття (merge --abort)'), () => run('merge', () => R('abortMerge'), t('Скасовано')), !!s.merging],
    ['—'],

    [a.gh ? (a.ghAuthed ? t('GitHub: @{user} ✓ — вийти', { user: a.ghUser }) : t('Увійти в GitHub')) : t('Встановити GitHub CLI (gh)'), () => a.gh ? ghToggle() : installGh(), true],
  ];

  p.querySelectorAll('[data-i]').forEach(el => el.onclick = () => { closePops(); Promise.resolve(items[el.dataset.i][1]()).catch(e => toast(e.message, true)); });
}
async function addRemote() {
  const v = await modal(t('Додати remote "origin"'), [{ id: 'url', label: t('URL репозиторію на GitHub'), placeholder: 'https://github.com/owner/repo.git' }], t('Додати')); if (!v || !v.url) return;
  run('remote', () => R('addRemote', { url: v.url }), t('Додано'));
}

async function doSync() {
  const si = syncInfo();
  if (si.act === 'publish') {
    if (!S.app.gh) { if (confirm(t('Для створення репозиторію на GitHub потрібен GitHub CLI (gh). Встановити? Якщо репозиторій уже створено на github.com — скасуйте і скористайтесь меню ⋯ → "Додати remote вручну".'))) installGh(); return; }
    if (!S.app.ghAuthed) { ghLogin(); return; }
    if (!S.st.hasCommits) { toast(t('Спочатку зробіть хоча б один коміт'), true); return; }
    const v = await modal(t('Опублікувати на GitHub'), [{ id: 'name', label: t('Назва репозиторію'), value: base(S.repo) }, { id: 'private', type: 'checkbox', label: t('Приватний репозиторій'), value: true }], t('Опублікувати')); if (!v || !v.name) return;
    return run('publish', () => R('publish', v), t('Опубліковано!'));
  }
  run(si.act, () => R(si.act), r => (r.out || '').trim() || t('Готово'));
}

function renderSide() {
  const m = $('#main');
  if (!S.repo) return renderWelcome();
  const s = S.st, n = s ? s.files.length : 0;
  if (!m.querySelector('.side')) {
    m.innerHTML = `<div class="side"><div class="tabs"><div class="tab" id="tChanges"></div><div class="tab" id="tHistory"></div></div><div id="sideBody" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div>
      <div class="content"><div id="meta"></div><div id="diff"><div class="empty">${esc(t('Оберіть файл'))}</div></div></div>`;
    $('#tChanges').onclick = () => { S.tab = 'changes'; S.commit = null; renderSide(); showFileDiff(); };
    $('#tHistory').onclick = () => { S.tab = 'history'; renderSide(); loadLog(); };
  }
  $('#tChanges').innerHTML = `${esc(t('Зміни'))} ${n ? `<span class="pill">${n}</span>` : ''}`;
  $('#tHistory').textContent = t('Історія');
  $('#tChanges').className = 'tab' + (S.tab === 'changes' ? ' on' : '');
  $('#tHistory').className = 'tab' + (S.tab === 'history' ? ' on' : '');
  $('#meta').style.display = S.tab === 'history' ? 'block' : 'none';
  S.tab === 'changes' ? renderChanges() : renderHistory();
}

const letter = f => (f.x === 'U' || f.y === 'U' || (f.x === 'A' && f.y === 'A') || (f.x === 'D' && f.y === 'D')) ? 'U' : f.x === '?' ? 'A' : (f.x !== ' ' ? f.x : f.y);
const staged = f => f.x !== ' ' && f.x !== '?';
function renderChanges() {
  const s = S.st, body = $('#sideBody'); if (!s) return;
  const files = s.files, nStaged = files.filter(staged).length;
  const prev = body.querySelector('#sum') ? { sum: body.querySelector('#sum').value, desc: body.querySelector('#desc').value } : { sum: '', desc: '' };
  const hadFocus = document.activeElement && (document.activeElement.id === 'sum' || document.activeElement.id === 'desc') ? document.activeElement.id : null;
  body.innerHTML = `<div class="listhead"><input type="checkbox" id="all" ${files.length && nStaged === files.length ? 'checked' : ''} ${files.length ? '' : 'disabled'}> <span>${esc(t('{n} змінених файлів', { n: files.length }))}${s.merging ? ` · <b style="color:var(--yellow)">${esc(t('йде злиття'))}</b>` : ''}</span></div>
    <div class="list">${files.map(f => { const l = letter(f), partial = staged(f) && f.y !== ' ' && f.y !== undefined && f.x !== '?'; return `<div class="row ${f.path === S.sel ? 'sel' : ''}" data-p="${esc(f.path)}"><input type="checkbox" data-c="${esc(f.path)}" ${staged(f) ? 'checked' : ''} ${partial ? 'class=part' : ''}><span class="nm" title="${esc(f.path)}">${esc(f.path)}</span><button class="x" data-d="${esc(f.path)}" title="${esc(t('Скасувати зміни'))}">↶</button><span class="badge ${l}">${l === 'A' && f.x === '?' ? 'N' : l}</span></div>`; }).join('') || `<div class="empty" style="margin:30px 10px">${esc(t('Немає змін ✨'))}</div>`}</div>
    <div class="commitbox"><input type="text" id="sum" placeholder="${esc(t('Короткий опис (summary)'))}" value="${esc(prev.sum)}"><textarea id="desc" placeholder="${esc(t("Опис (необов'язково)"))}">${esc(prev.desc)}</textarea>
      <button class="primary" id="doCommit" ${nStaged ? '' : 'disabled'}>${esc(t('Коміт у'))} <b>${esc(s.branch)}</b> (${nStaged})</button>${s.lastSubject ? `<small style="color:var(--mute)">${esc(t('Останній: {s}', { s: s.lastSubject }))}</small>` : ''}</div>`;
  if (hadFocus) { const el = body.querySelector('#' + hadFocus); el.focus(); el.setSelectionRange && el.setSelectionRange(el.value.length, el.value.length); }
  const byPath = p => files.find(f => f.path === p);
  body.querySelector('#all').onchange = e => run('stage', () => R(e.target.checked ? 'stageAll' : 'unstageAll'));
  body.querySelectorAll('[data-p]').forEach(el => el.onclick = e => { if (e.target.dataset.c !== undefined || e.target.dataset.d !== undefined) return; S.sel = el.dataset.p; renderChanges(); showFileDiff(); });
  body.querySelectorAll('[data-c]').forEach(el => el.onchange = () => run('stage', () => R(el.checked ? 'stage' : 'unstage', { paths: [el.dataset.c] })));
  body.querySelectorAll('[data-d]').forEach(el => el.onclick = () => { const f = byPath(el.dataset.d); if (confirm(t('Скасувати зміни у "{p}"? Це незворотньо.', { p: f.path }))) run('discard', () => R('discard', { files: [{ path: f.path, untracked: f.x === '?' }] }), t('Зміни скасовано')); });
  $('#doCommit').onclick = async () => {
    const summary = $('#sum').value.trim(); if (!summary) { toast(t('Напишіть короткий опис коміту'), true); $('#sum').focus(); return; }
    const r = await run('commit', () => R('commit', { summary, description: $('#desc').value }), t('Коміт створено ✓'));
    if (r) { $('#sum').value = ''; $('#desc').value = ''; }
  };
  $('#sum').onkeydown = e => { if (e.key === 'Enter') $('#doCommit').click(); };
}

async function showFileDiff() {
  const d = $('#diff'); if (!d || S.tab !== 'changes') return;
  const f = S.st && S.st.files.find(x => x.path === S.sel);
  if (!f) { d.innerHTML = `<div class="empty">${esc(S.st && S.st.files.length ? t('Оберіть файл') : t("Змін немає. Редагуйте файли у своєму редакторі — вони з'являться тут автоматично."))}</div>`; return; }
  try { const r = await R('diff', { path: f.path, untracked: f.x === '?' }); if (S.sel === f.path) d.innerHTML = renderDiff(r.diff); } catch (e) { d.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function renderDiff(text) {
  if (!text.trim()) return `<div class="empty">${esc(t('Немає відображуваних змін (порожній або бінарний файл)'))}</div>`;
  let o = 0, n = 0, html = '<table class="d">';
  for (const l of text.split('\n')) {
    if (l.startsWith('@@')) { const m = /@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(l); if (m) { o = +m[1]; n = +m[2]; } html += `<tr class="hunk"><td class="ln"></td><td class="ln"></td><td>${esc(l)}</td></tr>`; }
    else if (/^(diff |index |--- |\+\+\+ |new file|deleted file|similarity|rename|old mode|new mode|Binary)/.test(l) && o === 0 && n === 0) html += `<tr class="meta"><td class="ln"></td><td class="ln"></td><td>${esc(l)}</td></tr>`;
    else if (l.startsWith('+')) html += `<tr class="add"><td class="ln"></td><td class="ln">${n++}</td><td>${esc(l)}</td></tr>`;
    else if (l.startsWith('-')) html += `<tr class="del"><td class="ln">${o++}</td><td class="ln"></td><td>${esc(l)}</td></tr>`;
    else if (l.startsWith('\\')) html += `<tr class="meta"><td class="ln"></td><td class="ln"></td><td>${esc(l)}</td></tr>`;
    else if (o || n) html += `<tr><td class="ln">${o++}</td><td class="ln">${n++}</td><td>${esc(l)}</td></tr>`;
  }
  return html + '</table>';
}

/* ---------- history ---------- */
async function loadLog() {
  try { const r = await R('log'); S.log = r.commits; S.unpushed = r.unpushed; renderHistory(); if (!S.commit && S.log.length) openCommit(S.log[0].sha); } catch (e) { toast(e.message, true); }
}
const ago = iso => { const s = (Date.now() - new Date(iso)) / 1000; if (s < 60) return t('щойно'); if (s < 3600) return t('{n} хв', { n: Math.floor(s / 60) }); if (s < 86400) return t('{n} год', { n: Math.floor(s / 3600) }); if (s < 2592000) return t('{n} дн', { n: Math.floor(s / 86400) }); return new Date(iso).toLocaleDateString(); };
function renderHistory() {
  const body = $('#sideBody'); if (!body) return;
  body.innerHTML = `<div class="list">${S.log.map(c => `<div class="row ${c.sha === S.commit ? 'sel' : ''}" data-s="${c.sha}" style="flex-direction:column;align-items:stretch;gap:0"><div class="nm" title="${esc(c.subject)}">${esc(c.subject)}</div><small style="color:var(--mute)">${esc(c.author)} · ${ago(c.date)} · ${c.short} ${S.unpushed.includes(c.sha) ? `<span class="up">↑ ${esc(t('не відправлено'))}</span>` : ''}</small></div>`).join('') || `<div class="empty" style="margin:30px 10px">${esc(t('Комітів ще немає'))}</div>`}</div>`;
  body.querySelectorAll('[data-s]').forEach(el => el.onclick = () => openCommit(el.dataset.s));
}
async function openCommit(sha) {
  S.commit = sha; renderHistory();
  try {
    const r = await R('show', { sha });
    $('#meta').innerHTML = `<div><b>${esc(r.message.split('\n')[0])}</b></div><div style="color:var(--mute);font-size:12px">${esc(r.author)} &lt;${esc(r.email)}&gt; · ${new Date(r.date).toLocaleString()} · ${r.sha.slice(0, 7)}</div>${r.message.includes('\n') ? `<div class="msg">${esc(r.message.split('\n').slice(1).join('\n').trim())}</div>` : ''}<div id="chips" style="margin-top:8px">${r.files.map((f, i) => `<span class="chip" data-f="${esc(f.path)}"><span class="${f.status}">${f.status}</span> ${esc(f.path)}</span>`).join('')}</div>`;
    $('#meta').querySelectorAll('.chip').forEach(c => c.onclick = () => showCommitFile(sha, c.dataset.f, c));
    const first = $('#meta .chip'); first ? showCommitFile(sha, first.dataset.f, first) : $('#diff').innerHTML = `<div class="empty">${esc(t('Порожній коміт'))}</div>`;
  } catch (e) { toast(e.message, true); }
}
async function showCommitFile(sha, path, chip) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('sel')); chip.classList.add('sel');
  try { const r = await R('showDiff', { sha, path }); $('#diff').innerHTML = renderDiff(r.diff); } catch (e) { toast(e.message, true); }
}

/* ---------- welcome ---------- */
function renderWelcome() {
  const repos = (S.app && S.app.repos) || [], last = localStorage.getItem('lastRepo');
  const list = repos.length ? `<div class="wlist-h">${esc(t('Ваші репозиторії'))}</div><div class="wlist">${repos.map(r => `<div class="row" data-r="${esc(r)}" title="${esc(r)}"><span class="nm">${esc(base(r))}${r === last ? ` <small style="color:var(--mute)">· ${esc(t('востаннє'))}</small>` : ''}</span><button class="x" data-rm="${esc(r)}" title="${esc(t('Прибрати зі списку'))}">✕</button></div>`).join('')}</div><div class="wlist-h">${esc(t('Або додайте новий'))}</div>` : '';
  $('#main').innerHTML = `<div class="welcome"><div class="logo">⎇</div><h1>GitHub Helper</h1><div style="color:var(--mute);font:600 13px 'Cascadia Mono',Consolas,monospace">v${esc(VERSION)}</div>
    <p style="color:var(--mute)">${esc(t('Робіть коміти, гілки та синхронізацію з GitHub без командного рядка.'))}</p>
    <ul class="wfeat"><li>${esc(t('📝 Перегляд змін і коміти в кілька кліків'))}</li><li>${esc(t('🌿 Гілки, історія та злиття'))}</li><li>${esc(t('☁️ Синхронізація і публікація на GitHub'))}</li></ul>
    ${list}<div class="btns"><button class="${repos.length ? '' : 'primary'}" id="wClone">${esc(t('⬇ Клонувати репозиторій з GitHub'))}</button><button id="wAdd">${esc(t('📁 Додати наявну папку з проєктом'))}</button><button id="wNew">${esc(t('✚ Створити новий репозиторій'))}</button></div></div>`;
  $('#wClone').onclick = cloneRepo; $('#wAdd').onclick = addRepo; $('#wNew').onclick = newRepo;
  $('#main').querySelectorAll('.wlist [data-r]').forEach(el => el.onclick = e => { if (e.target.dataset.rm) return; selectRepo(el.dataset.r); });
  $('#main').querySelectorAll('.wlist [data-rm]').forEach(el => el.onclick = async e => { e.stopPropagation(); await api('removeRepo', { repo: el.dataset.rm }); S.app = await api('state'); renderWelcome(); });
}
function goHome() { closePops(); S.repo = null; S.st = null; S.sel = null; S.commit = null; S.stJson = ''; renderAll(); }

/* ---------- startup: splash + auto-update ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const splashMsg = m => { const el = $('#splashMsg'); if (el) el.textContent = m; };
// After an update the server restarts on the same port with a new token: the old token is rejected (403)
// by the new process, which tells us it is up and the page must be reloaded to pick up the new token.
async function waitForRestart() {
  await sleep(1500);
  for (let i = 0; i < 80; i++) {
    try { await api('state'); }
    catch (e) { if (/bad token/i.test(e.message)) return true; }
    await sleep(500);
  }
  return false;
}
async function startup() {
  const t0 = Date.now();
  splashMsg(t('Перевірка оновлень…'));
  let info = null;
  try { info = await api('updateCheck'); } catch (e) { }
  if (info && info.available) {
    splashMsg(t('Знайдено оновлення v{v}. Встановлення…', { v: info.latest }));
    try {
      await api('updateInstall');
      splashMsg(t('Перезапуск…'));
      if (await waitForRestart()) { location.reload(); return; }
    } catch (e) { setTimeout(() => toast(t('Не вдалося оновитися: ') + e.message, true), 600); }
  }
  splashMsg(t('Запуск…'));
  await boot();
  await sleep(Math.max(0, 1400 - (Date.now() - t0)));   // show the title screen long enough to read the version
  const sp = $('#splash'); sp.classList.add('hide'); setTimeout(() => sp.remove(), 500);
}
startup().catch(e => { document.body.innerHTML = '<p style="padding:20px">' + esc(t('Не вдалося підключитись до локального сервера: ')) + esc(e.message) + '</p>'; });
</script>
